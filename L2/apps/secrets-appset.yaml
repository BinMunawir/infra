# L2/apps/secrets-appset.yaml — the credentials each DEPENDENCY needs.
#
# One Application per dependency per env, sourcing
# L2/deps/<app>/<stage>-<provider>/secrets/: the ExternalSecrets that pull a
# dependency's credentials out of the store and materialise them as Secrets in
# its namespace. They live beside the values file that references them, so the
# Secret name and key names a chart expects are in the same directory as the
# chart values that consume them.
#
# ─── why only deps ─────────────────────────────────────────────────────────
# A Go service needs nothing here. charts/go-service renders each service's
# ExternalSecret from its own values file, so a service's secrets are already
# co-located — they are declared in L2/services/<name>/<env>.yaml under
# `secrets.data` and `database.credentials`, and never as a loose manifest.
# These upstream charts have no such plumbing, which is the whole reason this
# appset exists.
#
# EVERY DEP NEEDS A <stage>-<provider>/secrets/ DIRECTORY. An Argo Application
# whose directory path does not exist is a hard ComparisonError, not an empty
# sync. If a dep genuinely needs no credentials, put a .gitkeep in it — Argo's
# directory source reads only .yaml/.yml/.json, so it syncs empty and green.
#
# ─── what is NOT here ──────────────────────────────────────────────────────
# The ClusterSecretStore is L1's — see L1/platform/secrets-appset.yaml. It is
# the connection to the backend, it is cluster-scoped, and external-secrets is
# an L1 component; holding it here forced L2's AppProject to whitelist a
# cluster-scoped kind. Everything in these directories is namespaced and names
# an application.
#
# Syncs at wave -1: the workload waiting on a Secret never starts if the
# ExternalSecret has not resolved. The store it names is already up — L1
# converges first.
#
# Every ExternalSecret declares its own namespace (next to the workload that
# reads the Secret), so the destination below is only where Argo tracks the
# Application.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: maal-secrets
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - matrix:
        generators:
          - git:
              repoURL: git@github.com:BinMunawir/infra.git
              revision: main
              files:
                - path: L2/envs/*.yaml

          - git:
              repoURL: git@github.com:BinMunawir/infra.git
              revision: main
              files:
                - path: L2/deps/*/dep.yaml

  template:
    metadata:
      name: '{{.stage}}-{{.provider}}-{{.app}}-secrets'
      labels:
        service/stage: '{{.stage}}'
        service/provider: '{{.provider}}'
        service/dep: '{{.app}}'
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: maal
      source:
        repoURL: git@github.com:BinMunawir/infra.git
        targetRevision: main
        path: L2/deps/{{.app}}/{{.stage}}-{{.provider}}/secrets
        directory:
          recurse: false
      destination:
        server: '{{.destination.server}}'
        namespace: argocd
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
