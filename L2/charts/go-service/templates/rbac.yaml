{{/*
One ServiceAccount per service. It is also the mesh identity: ztunnel issues an
mTLS cert for cluster.local/ns/<ns>/sa/<name>, which is what
AuthorizationPolicy principals match on. So this object is doing two jobs, and
sharing it between services would collapse two identities into one.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "go-service.serviceAccountName" . }}
  labels:
    {{- include "go-service.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
# No API access is granted. These services talk to Postgres, Temporal, and each
# other — none of that needs the Kubernetes API, so there is no Role to bind.
automountServiceAccountToken: false
{{- end }}
