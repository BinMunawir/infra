# The edge — dev-local.
#
# THIS IS WHAT `lbEndpoint` POINTS AT. L0 maps host 127.0.0.1:8080 to NodePort
# 30080 on the kind control-plane node (L0/local/kind.yaml); this Gateway is the
# thing that answers there.
#
# HTTPS only, on a single listener, because kind publishes exactly one port and
# a plaintext edge would teach the wrong habit. The certificate is self-signed
# locally, so `curl -k` — or trust the root once, see ../../Readme.md.
#
# istiod provisions a Deployment and a Service from this object. The Service's
# nodePort is assigned dynamically and CANNOT be pinned through the Gateway API
# — the one imperative step left in a local bring-up is `just edge-port`, which
# patches it to 30080. See the note there; the fix is Istio's manual-deployment
# mode, which is a deliberate piece of work rather than a values change.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: maal-edge
  namespace: maal-edge
  annotations:
    # kind has no cloud load balancer, so a LoadBalancer Service would sit at
    # <pending> forever (L0/contract.md). NodePort is what the port mapping
    # expects. Cloud envs drop this annotation and get a real LB.
    networking.istio.io/service-type: NodePort
spec:
  gatewayClassName: istio
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: maal-edge-tls
      allowedRoutes:
        # Routes attach from the service namespaces they front, so each route
        # sits next to its own backend and needs no ReferenceGrant. The
        # AppProject's namespace list is the real boundary on what can exist.
        namespaces:
          from: All
