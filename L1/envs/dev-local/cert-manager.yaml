# cert-manager — dev-local
#
# CRDs come from the chart. That is fine while cert-manager is the only thing
# that owns them; if you ever split CRDs out, `helm.sh/resource-policy: keep`
# becomes essential — deleting cert-manager CRDs deletes every Certificate in
# the cluster.
crds:
  enabled: true
  keep: true

# cert-manager defaults its leader-election Role/RoleBinding to kube-system,
# which the `platform` AppProject deliberately does not list as a destination —
# see ../../root/project.yaml. Sync fails with:
#   "namespace kube-system is not permitted in project 'platform'"
#
# Fixed here rather than by adding kube-system to the project: that project
# carries `clusterResourceWhitelist: '*'`, so listing kube-system as a
# destination would let all of L1 write into it, to legalise four
# leader-election objects. Keep the boundary; move the objects.
global:
  leaderElection:
    namespace: cert-manager

resources:
  requests:
    cpu: 20m
    memory: 64Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

cainjector:
  resources:
    requests:
      cpu: 20m
      memory: 128Mi

# No ClusterIssuer here. Issuers are policy, not platform: ACME/DNS01 needs a
# real domain and cloud credentials, and a self-signed issuer is an L2 concern.
# L1 installs the *capability* only — same rule as the Gateway API CRDs, which
# create no Gateway.
