# L2/apps/edge-appset.yaml — the way in.
#
# L1 installs the Gateway API CRDs (cluster-scoped, which is why they live
# there) and istiod implements the GatewayClass. This is where an actual
# `Gateway` object finally exists, which is what makes `lbEndpoint` — the third
# L0 contract output — mean something.
#
# Wave 2: after the services it routes to. A Gateway that comes up first is
# fine, but an HTTPRoute whose backend Service does not exist yet reports
# ResolvedRefs=False, and there is no reason to look at that.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: maal-edge
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - git:
        repoURL: git@github.com:BinMunawir/infra.git
        revision: main
        files:
          - path: L2/envs/*.yaml
          # Recursive glob — see the note in L1/platform/appset.yaml.
          - path: L2/envs/*/*.yaml
            exclude: true

  template:
    metadata:
      name: '{{.stage}}-{{.provider}}-edge'
      labels:
        maal/stage: '{{.stage}}'
        maal/provider: '{{.provider}}'
        maal/wave: "2"
      annotations:
        argocd.argoproj.io/sync-wave: "2"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: maal
      source:
        repoURL: git@github.com:BinMunawir/infra.git
        targetRevision: main
        path: L2/edge/{{.stage}}-{{.provider}}
        directory:
          recurse: false
      destination:
        server: '{{.destination.server}}'
        namespace: maal-edge
      syncPolicy:
        automated:
          # prune:false — deleting the Gateway takes the istiod-provisioned
          # Service with it, and with it the NodePort the L0 contract promises.
          # That is not something a generator hiccup should be able to do.
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        managedNamespaceMetadata:
          labels:
            # The gateway itself is NOT in the ambient dataplane: it is the
            # thing that admits traffic into the mesh, and enrolling it would
            # put ztunnel in front of its own ingress path.
            maal/component: edge
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
