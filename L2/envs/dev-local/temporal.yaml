# Temporal — dev-local
#
# The workflow spine. Every capability in every Maal service is a Temporal
# workflow (blueprint.md §1), so nothing else works until this does.
#
# The upstream chart used to bundle Cassandra, Elasticsearch, Prometheus and
# Grafana as subcharts. As of chart v1.0.0-rc.2 they are gone: there is nothing
# left to switch off, and the top-level `cassandra:` / `mysql:` / `postgresql:` /
# `elasticsearch:` / `prometheus:` / `grafana:` keys are now hard `fail`s in
# templates/_deprecations.tpl rather than ignored no-ops. Same for the old
# `schema.{createDatabase,setup,update}` block — see the note further down.
#
# ─── the database is EXTERNAL ──────────────────────────────────────────────
# The cluster runs no Postgres. `connectAddr` below points at one you manage
# yourself; `host.docker.internal` is how a kind node reaches a container on
# your laptop, which is the dev default. Point it at RDS/Cloud SQL and nothing
# else changes.
#
# YOU MUST CREATE BOTH DATABASES FIRST. Temporal needs `temporal` and
# `temporal_visibility`, owned by the user below:
#
#   CREATE ROLE temporal LOGIN PASSWORD '…';
#   CREATE DATABASE temporal            OWNER temporal;
#   CREATE DATABASE temporal_visibility OWNER temporal;
#
# The password comes from the store, never from here — see
# ../../secrets/dev-local/temporal-db.yaml.

server:
  replicaCount: 1

  config:
    persistence:
      # Which datastore below serves which role. Both are chart defaults; they
      # are written out because the names are referenced by nothing else and a
      # silent rename would be a very confusing outage.
      defaultStore: default
      visibilityStore: visibility

      # PINNED ON PURPOSE. numHistoryShards cannot be changed after the initial
      # deployment — Temporal rehashes nothing, so a different value on an
      # existing cluster means histories that can no longer be found. Leaving it
      # to the chart default would hand that decision to whoever next bumps the
      # chart version.
      numHistoryShards: 512

      # The post-v1.0.0-rc.2 shape: a map of named datastores that follows the
      # raw Temporal server config format. `existingSecret` and `secretKey` are
      # the only Helm-specific keys here and are stripped before rendering.
      datastores:
        default:
          sql:
            pluginName: postgres12
            databaseName: temporal
            connectAddr: "host.docker.internal:5432"
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-db   # chart reads the `password` key
            secretKey: password
            # OFF, deliberately. This issues `CREATE DATABASE`, and the external
            # database's owner role is not a superuser — so it would fail with
            # "permission denied to create database" on every sync. Creating the
            # two databases is a one-time act on the database server, above.
            createDatabase: false
            # ON. `setup-schema` then `update-schema`, both of which run inside a
            # database that already exists and need only the owner role — which
            # is exactly what the credential above grants. This one key replaces
            # the old `schema.setup` + `schema.update` pair.
            manageSchema: true

        visibility:
          sql:
            pluginName: postgres12
            databaseName: temporal_visibility
            connectAddr: "host.docker.internal:5432"
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-db
            secretKey: password
            createDatabase: false
            manageSchema: true

    # A Temporal server starts with NO namespaces. Nothing in the schema setup
    # creates one, so without this a worker connects, registers, and dies on
    # "Namespace default is not found" — which reads like a config typo rather
    # than a missing object.
    #
    # `default` because that is what maal-business and the Temporal SDK both
    # assume (see ../../envs/dev-local/maal-business.yaml). Giving Maal its own
    # namespace is the right move before this is anything but dev, and it is a
    # two-sided change: this list and every service's Temporal.Namespace.
    #
    # The job is idempotent — `namespace describe || namespace create` — so it
    # is safe on every sync, not just the first.
    namespaces:
      create: true
      namespace:
        - name: default
          retention: 3d

# Reachable at https://temporal.127.0.0.1.nip.io:8080 through the edge Gateway
# — see ../../edge/dev-local/routes.yaml. No /etc/hosts entry needed; nip.io
# resolves that name to 127.0.0.1 through public DNS.
web:
  enabled: true
  replicaCount: 1
