# Keycloak — dev-local
#
# The identity provider. maal_business holds only the `sub` reference; login,
# credentials, and sessions are Keycloak's, not the domain's (client/service.md §0).
#
# ─── the database is EXTERNAL ──────────────────────────────────────────────
# Same rule as Temporal: the cluster runs no Postgres. Create the database and
# role on whatever server you point KC_DB_URL_HOST at:
#
#   CREATE ROLE keycloak LOGIN PASSWORD '…';
#   CREATE DATABASE keycloak OWNER keycloak;
#
# Credentials come from ../../secrets/dev-local/keycloak-db.yaml, whose Secret
# keys are named for the env vars below so there is nothing to translate.

replicas: 1

# SERVE AT THE ROOT, not /auth.
#
# The chart still defaults relativePath to "/auth" for backwards compatibility
# with Keycloak 16 and earlier. Keycloak 26 — which is what this chart's image
# is — serves at the root, and every other reference in this repo assumes that:
# ../../edge/dev-local/routes.yaml forwards the path unmodified, maal-business's
# Keycloak.BaseURL carries no prefix, and `just hosts` prints a /realms/master
# URL. Leaving the default would 404 all three while the pod reported healthy.
#
# It also moves the health endpoints the probes below use: they are derived from
# this value, so /health/ready rather than /auth/health/ready.
http:
  relativePath: "/"

# `start --optimized` skips the build step, which requires the image to have
# been built with the same feature flags. Locally we want the plain `start`
# so the DB vendor is resolved at boot.
command:
  - "/opt/keycloak/bin/kc.sh"
  - "--verbose"
  - "start"
  - "--http-enabled=true"
  - "--http-port=8080"
  - "--hostname-strict=false"

extraEnv: |
  - name: KC_DB
    value: postgres
  - name: KC_DB_URL_HOST
    value: host.docker.internal
  - name: KC_DB_URL_DATABASE
    value: keycloak
  - name: KC_DB_USERNAME
    valueFrom:
      secretKeyRef:
        name: keycloak-db
        key: KC_DB_USERNAME
  - name: KC_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-db
        key: KC_DB_PASSWORD
  # NOTHING THAT THE CHART ALSO SETS. KC_HEALTH_ENABLED, KC_METRICS_ENABLED and
  # KC_PROXY_HEADERS all belong to chart values (`health`, `metrics`, `proxy`
  # below) and are rendered from them unconditionally. Repeating one here does
  # not override it — it appends a second entry with the same name, and
  # ServerSideApply rejects the whole StatefulSet with "duplicate entries for
  # key [name=…]". extraEnv is for vars the chart has no opinion about.
  #
  # Initial admin. Keycloak 26 reads KC_BOOTSTRAP_ADMIN_*; the KEYCLOAK_ADMIN_*
  # pair is the pre-26 spelling, kept alongside so an image bump in either
  # direction still boots with an admin. The Secret carries both keys — see
  # ../../secrets/dev-local/keycloak-admin.yaml.
  - name: KC_BOOTSTRAP_ADMIN_USERNAME
    valueFrom:
      secretKeyRef:
        name: maal-keycloak-admin
        key: KC_BOOTSTRAP_ADMIN_USERNAME
  - name: KC_BOOTSTRAP_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: maal-keycloak-admin
        key: KC_BOOTSTRAP_ADMIN_PASSWORD
  - name: KEYCLOAK_ADMIN
    valueFrom:
      secretKeyRef:
        name: maal-keycloak-admin
        key: KEYCLOAK_ADMIN
  - name: KEYCLOAK_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: maal-keycloak-admin
        key: KEYCLOAK_ADMIN_PASSWORD

# Off: the database is external. This subchart would create a second one.
postgresql:
  enabled: false

# Terminating TLS at the edge Gateway means Keycloak sees plaintext and must be
# told to trust the forwarded proto, or it builds redirect URLs on http:// and
# the OIDC flow breaks in a way that looks like a client misconfiguration.
# `mode` is the value of KC_PROXY_HEADERS; the chart renders the env var itself.
proxy:
  enabled: true
  mode: xforwarded
  http:
    enabled: true

# Both default to true in the chart and are the source of the KC_METRICS_ENABLED
# and KC_HEALTH_ENABLED env vars. Stated here because the probes below depend on
# `health` being on, which is not obvious from the probe block alone.
metrics:
  enabled: true

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 1Gi

health:
  enabled: true

# No Ingress. The edge is a Gateway API Gateway — see
# ../../edge/dev-local/gateway.yaml — and Keycloak is reachable at
# https://keycloak.maal.local:8080 once `just hosts` is in place.
ingress:
  enabled: false
