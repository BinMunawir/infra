# Keycloak's admin console and OIDC endpoints — dev-local.
#
# Lives next to the chart values that configure the backend it points at
# (../../dev-local.yaml), so the hostname, the Service name and the port that
# must agree are all in one directory.
#
# In the namespace of the Service it fronts, so its backendRef is same-namespace
# and needs no ReferenceGrant. Attaching to a Gateway in another namespace is
# governed by that Gateway's `allowedRoutes`, which L1 sets to `from: All`.
#
# Every default is written out on purpose — see the note in
# ../../../../apps/routes-appset.yaml. Leaving one out reads OutOfSync forever
# under ServerSideApply.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edge
      namespace: edge
      sectionName: https
  hostnames:
    - keycloak.127.0.0.1.nip.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: keycloak-keycloakx-http
          port: 80
          weight: 1
