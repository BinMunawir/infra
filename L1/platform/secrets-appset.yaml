# L1/platform/secrets-appset.yaml — the ClusterSecretStore each environment
# pulls its secrets from.
#
# One Application per env, sourcing L1/secrets/<stage>-<provider>/. That
# directory is where the local `fake` provider and a cloud Secrets Manager
# differ — and the only place they differ. Every ExternalSecret in L2 refers to
# the store by name, so nothing in the application layer changes when an env
# moves to a real backend.
#
# ─── why this is L1 ────────────────────────────────────────────────────────
# A ClusterSecretStore is a connection to a backend, it is cluster-scoped, and
# external-secrets itself is installed by L1. Holding it in L2 meant that
# layer's AppProject had to whitelist a cluster-scoped kind — a carve-out in a
# boundary whose whole value is being short. The ExternalSecrets that name this
# store are application-scoped and stay in L2.
#
# ORDERING: wave -1. Like the edge appset this carries no RollingSync strategy,
# so the annotation orders it against other Applications' waves on a best-effort
# basis; the retry/backoff below is what actually converges it if
# external-secrets' CRDs are not served yet. An ExternalSecret with no store
# just sits Pending, and the workload waiting on its Secret never starts.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-secret-store
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - git:
        repoURL: git@github.com:BinMunawir/infra.git
        revision: main
        files:
          - path: L1/envs/*.yaml
          # Recursive glob — see the note in appset.yaml.
          - path: L1/envs/*/*.yaml
            exclude: true

  template:
    metadata:
      name: '{{.stage}}-{{.provider}}-secret-store'
      labels:
        platform.maal/stage: '{{.stage}}'
        platform.maal/provider: '{{.provider}}'
        platform.maal/component: secret-store
        # NO platform.maal/wave LABEL. That label exists solely to feed the
        # RollingSync matchExpressions in appset.yaml, and this appset declares
        # no RollingSync — the annotation below is what orders it.
        #
        # It also cannot be one: a Kubernetes label value must start and end
        # with an alphanumeric character, so "-1" is rejected outright and the
        # generator fails with `Application ... is invalid: metadata.labels`
        # while still reporting ParametersGenerated=True. The Application is
        # simply never created, which reads as a silent generator failure.
        # Annotations carry no such restriction, which is why the next line is
        # fine.
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: git@github.com:BinMunawir/infra.git
        targetRevision: main
        path: L1/secrets/{{.stage}}-{{.provider}}
        directory:
          recurse: false
      destination:
        server: '{{.destination.server}}'
        # A ClusterSecretStore is cluster-scoped; the namespace here is only
        # where Argo tracks the resource.
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
