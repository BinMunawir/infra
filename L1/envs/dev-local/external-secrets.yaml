# external-secrets — dev-local
#
# The operator only. L2 declares the `SecretStore` and `ExternalSecret`
# resources; L1 just makes those kinds exist — same rule as cert-manager.
#
# Locally there is no cloud secret manager to point at, and no workload identity
# to reach one with. The dev-local store therefore uses the built-in `fake`
# provider, which serves literal values from the store spec itself — see
# ../../secrets/dev-local/cluster-secret-store.yaml. Cloud envs swap that for
# AWS Secrets Manager or GCP Secret Manager and change nothing else.
installCRDs: true

resources:
  requests:
    cpu: 20m
    memory: 96Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

certController:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
