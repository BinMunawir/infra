# L2/apps/routes-appset.yaml — the routing table.
#
# One Application per env, sourcing L2/routes/<stage>-<provider>/: the
# HTTPRoutes that point the platform's edge at Maal services.
#
# ─── what is NOT here ──────────────────────────────────────────────────────
# The Gateway, its TLS listener and its certificate are L1's — see
# L1/platform/edge-appset.yaml. This layer owns only the routes, each of which
# names a Maal Service and therefore could not live anywhere else without the
# platform layer depending on the application layer.
#
# Wave 2: after the services they route to. A route whose backend Service does
# not exist yet reports ResolvedRefs=False, and there is no reason to look at
# that. The Gateway itself is already up — it is L1's, and L1 converges first.
#
# Every route declares its own namespace (next to the Service it fronts), so
# the destination below is only where Argo tracks the Application.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: maal-routes
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - git:
        repoURL: git@github.com:BinMunawir/infra.git
        revision: main
        files:
          - path: L2/envs/*.yaml
          # Recursive glob — see the note in L1/platform/appset.yaml.
          - path: L2/envs/*/*.yaml
            exclude: true

  template:
    metadata:
      name: '{{.stage}}-{{.provider}}-routes'
      labels:
        maal/stage: '{{.stage}}'
        maal/provider: '{{.provider}}'
        maal/wave: "2"
      annotations:
        argocd.argoproj.io/sync-wave: "2"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: maal
      source:
        repoURL: git@github.com:BinMunawir/infra.git
        targetRevision: main
        path: L2/routes/{{.stage}}-{{.provider}}
        directory:
          recurse: false
      destination:
        server: '{{.destination.server}}'
        namespace: argocd
      syncPolicy:
        automated:
          # prune:true is safe here in a way it is not for the Gateway: a route
          # that disappears from Git should disappear from the cluster, and
          # losing one costs a 404, not the cluster's entire entry point.
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
