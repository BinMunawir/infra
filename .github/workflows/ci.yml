# CI — the gate this repo did not have.
#
# Every Application in L1 and L2 syncs with `automated` + `selfHeal`, so a bad
# commit to main reaches the cluster without a human in the path. That is the
# right default for GitOps and it is only safe if something checks the commit
# first. This is that something.
#
# Most of it runs offline against no cluster: rendering, schema validation, and
# the repo's own consistency rules. Nothing in those jobs needs credentials, so
# they are safe on pull requests from forks. The one exception is `e2e`, which
# builds a real cluster and is therefore gated — see the note on that job.
#
# The offline jobs call `just check <piece>` rather than reimplementing the
# checks here, so `just check` before pushing runs exactly what CI runs.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── the Helm chart every Go service uses, and the upstream ones ─────────
  charts:
    name: charts render + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - uses: extractions/setup-just@v2

      - name: Render go-service, and every upstream chart against our values
        # `just check charts` does two things. The first — rendering each
        # service through the local chart — is what catches a values file that
        # no longer matches the chart's contract.
        #
        # The second is new and covers the gap that mattered most: the values
        # files for the UPSTREAM charts (istiod, temporal, keycloakx, …) were
        # previously only checked for parsing and existence. Nothing noticed
        # that a key had been renamed three chart versions ago. Rendering
        # against the pinned chart is what notices — Temporal's own
        # _deprecations.tpl, for one, turns a stale `schema.setup` key into a
        # hard failure, and this is where that should surface.
        run: just check charts

      - name: Render for schema validation
        # Separate from the step above, which renders to /dev/null. kubeconform
        # needs the manifests on disk, and that is a CI-only need.
        run: |
          set -euo pipefail
          mkdir -p /tmp/rendered
          for f in L2/envs/dev-local/maal-*.yaml; do
            s=$(basename "$f" .yaml)
            helm template "$s" L2/charts/go-service -f "$f" > "/tmp/rendered/$s.yaml"
          done

      - name: Render the off-by-default templates too
        # networkPolicy and migrations ship disabled, so the renders above never
        # touch them — which would leave two templates that nothing schema-checks
        # until the first environment turns them on. That is exactly the wrong
        # time to discover a typo in a field name.
        #
        # Rendered into the same directory so the kubeconform steps below cover
        # them. The values here are throwaway shapes chosen to exercise the
        # template, not a configuration anyone runs.
        run: |
          set -euo pipefail
          helm template netpol-probe L2/charts/go-service \
            -f L2/envs/dev-local/maal-business.yaml \
            --set networkPolicy.enabled=true \
            --set 'networkPolicy.egress[0].to[0].ipBlock.cidr=10.0.0.0/16' \
            --set 'networkPolicy.egress[0].ports[0].port=5432' \
            --set 'networkPolicy.egress[0].ports[0].protocol=TCP' \
            > /tmp/rendered/_netpol-probe.yaml
          helm template migrate-probe L2/charts/go-service \
            -f L2/envs/dev-local/maal-business.yaml \
            --set migrations.enabled=true \
            --set migrations.image=example/goose:dev \
            > /tmp/rendered/_migrate-probe.yaml

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Validate rendered manifests against real schemas
        # -schema-location includes the CRD catalog, so ExternalSecret and
        # AuthorizationPolicy are checked against their actual schemas rather
        # than skipped. `-strict` rejects unknown fields, which is what catches
        # a values key that renders into a field that does not exist.
        run: |
          kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/rendered/

      - name: Validate hand-written manifests
        # The Argo objects, the secret store, the edge (L1) and the routes (L2).
        # `-ignore-missing-schemas` here and not above: these reference CRDs
        # (ApplicationSet, Gateway) whose schemas move faster than the catalog,
        # and a missing schema must not be the thing that fails a build.
        run: |
          kubeconform \
            -summary \
            -kubernetes-version 1.31.0 \
            -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            L1/platform L1/root L1/envs L1/edge L1/secrets \
            L2/apps L2/root L2/secrets L2/routes

  # ─── security posture of what we actually deploy ─────────────────────────
  security:
    name: manifest security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Render the manifests to scan
        run: |
          set -euo pipefail
          mkdir -p /tmp/rendered
          for f in L2/envs/dev-local/maal-*.yaml; do
            s=$(basename "$f" .yaml)
            helm template "$s" L2/charts/go-service -f "$f" > "/tmp/rendered/$s.yaml"
          done

      - name: Trivy — CRITICAL misconfigurations (blocking)
        # Scoped to CRITICAL and to manifests WE render, deliberately.
        #
        # go-service already sets runAsNonRoot, drops all capabilities, forbids
        # privilege escalation and mounts a read-only root filesystem, so the
        # CRITICAL policies here — privileged containers, host namespaces,
        # hostPath mounts — describe things this chart cannot currently produce.
        # That makes this a regression gate rather than a backlog: it fires when
        # someone adds one, not on the state of the repo today.
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: /tmp/rendered
          severity: CRITICAL
          exit-code: '1'

      - name: Trivy — HIGH and MEDIUM (report only)
        # NOT blocking, and that is a deliberate distinction rather than a
        # softer version of the step above. These policies include opinions
        # this repo has already considered and settled — resource limits on
        # workloads whose limits are set per-env, for instance — so failing on
        # them would mean either arguing with the scanner in code or bulk
        # -ignoring it. Both end with the scan being disregarded.
        #
        # Reported to the job summary so a new finding is visible in the PR.
        # Promote a specific check to the blocking step above once it is clean.
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: /tmp/rendered
          severity: HIGH,MEDIUM
          exit-code: '0'
          format: table

      # NOTE: container IMAGE scanning is not here, and cannot be. The images
      # this platform runs are built from sibling repos (../client,
      # ../maalstream_ph) that CI has no access to — see the catalog note in
      # L2/apps/services-appset.yaml. Image scanning belongs in the workflow
      # that builds each image, next to the Dockerfile it scans.

  # ─── the repo's own consistency rules ────────────────────────────────────
  conventions:
    name: conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v2

      - name: Every YAML parses
        run: just check yaml

      - name: Every catalog entry has a values file
        # Reports gaps rather than failing: a component with nothing to
        # override legitimately has no file. The point is that the gap is
        # visible in the PR instead of discovered in the cluster.
        run: just check envs

      - name: No credential-shaped file is committed
        # .gitignore is the primary control; this is the check that it worked.
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(kubeconfig|contract\.json|backend\.hcl|.*\.tfvars|.*_deploy(\.pub)?|.*\.pem)$'; then
            echo "!! a credential- or environment-specific file is tracked" >&2
            exit 1
          fi
          echo ">> no credential-shaped files tracked"

      - name: Chart version bumped when templates change
        # The chart has no appVersion and many consumers, so `version` is the
        # only signal that a template changed. Advisory on purpose: not every
        # comment-only edit deserves a bump.
        if: github.event_name == 'pull_request'
        run: |
          set -uo pipefail
          git fetch --depth=1 origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD \
               | grep -q '^L2/charts/go-service/templates/'; then
            if ! git diff "origin/${{ github.base_ref }}"...HEAD -- L2/charts/go-service/Chart.yaml \
                 | grep -q '^+version:'; then
              echo "::warning::templates changed but go-service Chart.yaml version did not"
            fi
          fi

  # ─── shell ───────────────────────────────────────────────────────────────
  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: shellcheck every bootstrap script
        # These scripts are the imperative seam. They run with set -euo
        # pipefail against a real cluster, and an unquoted expansion there is a
        # much worse afternoon than one in a values file.
        run: just check shell

  # ─── L0 ──────────────────────────────────────────────────────────────────
  tofu:
    name: opentofu fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.5
      - run: just check tofu

  # ─── does it actually come up? ───────────────────────────────────────────
  #
  # Everything above is static. Every scar recorded in this repo's comments is
  # a RUNTIME one: istiod fighting Argo over a webhook's caBundle, RollingSync
  # never leaving wave 0, the gateway NodePort pinned by index landing on the
  # status port, a curl probe that reported ok when the edge was down. None of
  # those are detectable by rendering a template.
  #
  # This job builds a real cluster and asks L1 whether it delivered what it
  # promises.
  #
  # ─── the honest caveats ────────────────────────────────────────────────
  # 1. It runs AFTER merge, not before. Argo pulls this repo over SSH from
  #    `main`, so the cluster can only ever test what is already on main. A
  #    deploy key also cannot be exposed to pull requests from forks. This is a
  #    post-merge canary, not a pre-merge gate, and treating it as the latter
  #    would be a false sense of safety.
  # 2. L2 is NOT covered. Its services need images built from sibling repos CI
  #    cannot see, and its databases are external — on a Linux runner the kind
  #    nodes have no `host.docker.internal` to reach a laptop Postgres through.
  #    L1 is the layer whose failures are subtle; L2's are loud.
  e2e:
    name: e2e — L0 + L1 on kind
    runs-on: ubuntu-latest
    # Never on pull_request: the deploy key is not available to forks, and a
    # cluster that pulls `main` cannot test a branch anyway.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v2

      - name: Is the deploy key configured?
        # Skip cleanly rather than failing with an ssh error forty lines deep.
        # Without this secret the job cannot work at all, and a red X that means
        # "unconfigured" trains people to ignore a red X that means "broken".
        id: gate
        env:
          KEY: ${{ secrets.ARGOCD_SSH_KEY }}
        run: |
          if [ -z "${KEY:-}" ]; then
            echo "::warning::secret ARGOCD_SSH_KEY is not set — skipping the e2e cluster."
            echo "   Argo needs a read-only deploy key for this repo to sync from main."
            echo "   ssh-keygen -t ed25519 -N '' -f argocd_deploy, add the .pub at"
            echo "   Settings > Deploy keys, and the private half as ARGOCD_SSH_KEY."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install kind
        if: steps.gate.outputs.run == 'true'
        run: |
          curl -fsSLo /usr/local/bin/kind \
            https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          chmod +x /usr/local/bin/kind

      - name: Write the deploy key
        if: steps.gate.outputs.run == 'true'
        env:
          KEY: ${{ secrets.ARGOCD_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$HOME/argocd_deploy"
          printf '%s\n' "$KEY" > "$HOME/argocd_deploy"
          # L1/bootstrap/up.sh rejects a passphrase-protected key; fail here,
          # where the message is about the key, rather than mid-bootstrap.
          ssh-keygen -y -f "$HOME/argocd_deploy" >/dev/null

      - name: L0 — the cluster
        if: steps.gate.outputs.run == 'true'
        run: just up l0

      - name: L1 — the platform
        if: steps.gate.outputs.run == 'true'
        env:
          ARGOCD_SSH_KEY: /home/runner/argocd_deploy
        run: just up l1

      - name: Wait for the platform to converge, then pin the edge
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          export KUBECONFIG="$(just _kubeconfig)"
          # Same bounded poll `just up` uses. Written out here rather than
          # calling `just up all` because this job deliberately stops at L1.
          for i in $(seq 1 90); do
            bad="$(kubectl -n argocd get applications \
              -o jsonpath='{range .items[?(@.spec.project=="platform")]}{.metadata.name}{"\t"}{.status.sync.status}{"\t"}{.status.health.status}{"\n"}{end}' \
              | awk '$2 != "Synced" || $3 != "Healthy"' || true)"
            if [ -z "$bad" ] && kubectl -n argocd get applications \
                 -o jsonpath='{range .items[?(@.spec.project=="platform")]}{.metadata.name}{"\n"}{end}' | grep -q .; then
              echo ">> converged after $(( i * 10 ))s"; break
            fi
            [ $(( i % 6 )) -eq 0 ] && echo "   $(( i * 10 ))s — waiting on: $(echo "$bad" | awk '{print $1}' | tr '\n' ' ')"
            sleep 10
          done
          just edge-port

      - name: Does L1 deliver what it promises?
        if: steps.gate.outputs.run == 'true'
        run: just verify l1

      - name: What went wrong
        # Only on failure, and it is the whole reason this job is worth having:
        # a red `verify` line plus the Argo-side detail behind it.
        if: failure() && steps.gate.outputs.run == 'true'
        run: |
          export KUBECONFIG="$(just _kubeconfig)"
          just status || true
          for app in $(kubectl -n argocd get applications \
                -o jsonpath='{range .items[?(@.spec.project=="platform")]}{.metadata.name}{"\n"}{end}' 2>/dev/null); do
            just why "$app" || true
          done
          kubectl -n argocd logs deploy/argocd-applicationset-controller --tail=100 || true
