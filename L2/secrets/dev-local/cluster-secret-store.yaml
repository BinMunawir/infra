# The dev-local secret backend.
#
# `fake` serves the literal values below. That is the correct local choice, not
# a shortcut: kind has no workload identity (L0/contract.md), so a real Secrets
# Manager could only be reached with static cloud credentials — which would be
# a worse secret than the ones it holds.
#
# THESE ARE NOT SECRETS. They are obviously-fake development placeholders, and
# they must never be copied into a cloud env's store. A cloud env replaces this
# whole file with an `aws:` or `gcpsm:` provider block plus a serviceAccountRef;
# every ExternalSecret referring to `maal-secret-store` keeps working unchanged.
#
# DATABASE CREDENTIALS LIVE HERE TOO. The cluster runs no database and mints no
# database password, so every DSN is just another entry in this store — the same
# path as any other credential, in local and in cloud alike. Point the hosts in
# ../../envs/dev-local/ at whatever Postgres you are actually running and put
# its real password here (or better: change these and keep them out of Git by
# moving dev to a real store too).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: maal-secret-store
spec:
  provider:
    fake:
      data:
        # ─── Keycloak ──────────────────────────────────────────────────────
        # Admin API bearer token, read by maal_business's keycloak port to
        # provision organizations and users.
        - key: maal/keycloak/admin-token
          value: "dev-placeholder-not-a-real-token"

        # Keycloak's own initial admin login.
        - key: maal/keycloak/admin-user
          value: "admin"
        - key: maal/keycloak/admin-password
          value: "dev-placeholder-password"

        # Keycloak's external database.
        - key: maal/keycloak/db/username
          value: "keycloak"
        - key: maal/keycloak/db/password
          value: "dev-placeholder-db-password"

        # ─── Temporal ──────────────────────────────────────────────────────
        # The Temporal chart takes an `existingSecret` and reads the key
        # `password` from it; the username is plaintext config. See
        # ./temporal-db.yaml for the shape that produces.
        - key: maal/temporal/db/password
          value: "dev-placeholder-db-password"

        # ─── Maal services ─────────────────────────────────────────────────
        # go-service renders these into each service's own ExternalSecret;
        # DB_DSN is what the pg adapters read, with the parts as a fallback.
        - key: maal/business/db/username
          value: "maaladmin"
        - key: maal/business/db/password
          value: "dev-placeholder-db-password"
        - key: maal/business/db/dsn
          value: "postgres://maaladmin:dev-placeholder-db-password@host.docker.internal:5432/maalbizdb?sslmode=disable"

        - key: maal/stream-ph/db/username
          value: "phadmin"
        - key: maal/stream-ph/db/password
          value: "dev-placeholder-db-password"
        - key: maal/stream-ph/db/dsn
          value: "postgres://phadmin:dev-placeholder-db-password@host.docker.internal:5432/phdb?sslmode=disable"

        # ─── Hyperswitch (parked) ──────────────────────────────────────────
        # Kept so re-enabling is a catalog change rather than a rediscovery.
        # Real values here would be genuinely sensitive — the master key is what
        # makes that component a regulated system.
        - key: maal/hyperswitch/master-key
          value: "dev-placeholder-master-key"
        - key: maal/hyperswitch/admin-api-key
          value: "dev-placeholder-admin-api-key"
