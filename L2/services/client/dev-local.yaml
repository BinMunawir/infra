# client — dev-local.  ← THE REFERENCE SERVICE
#
# Source: git@github.com:BinMunawir/client.git
#
# This is the fully worked example: it exercises every feature of the
# go-service chart — ConfigMap config, an external database whose credentials
# arrive through an ExternalSecret, a second ExternalSecret of its own, and a
# mesh policy. Copy this file when adding a service and delete what you do not
# need.
#
# It is also the only service in the catalog that can actually run: its Temporal
# adapter reads TEMPORAL__HOSTPORT / TEMPORAL__NAMESPACE from config and falls
# back to the SDK defaults, and its pg adapter honours both DB_DSN and the
# individual DB__* parts. paymenthub is parked for the opposite reason.

image:
  # No registry locally. Build and load straight into kind:
  #   just image client
  # Cloud envs set image.registry to an ECR/GAR host and this becomes a pull.
  registry: ""
  repository: client
  tag: dev
  pullPolicy: IfNotPresent

# ─── workloads ─────────────────────────────────────────────────────────────
# The repo has cmd/{worker,starter,local}. Only `worker` is a long-running
# process: `starter` kicks off a workflow and exits, `local` is a dev harness.
# So one Deployment, not three.
workloads:
  worker:
    command: ["/app/worker"]
    replicas: 1
    http:
      enabled: false     # a Temporal worker accepts nothing inbound
    resources:
      requests: {cpu: 100m, memory: 192Mi}
      limits: {memory: 512Mi}

# ─── config ────────────────────────────────────────────────────────────────
# Non-secret only. Rendered to /app/config/dev.yml, which cleanenv reads after
# env vars — so anything set here is overridable by an env var, never the
# reverse.
config:
  env: dev
  mountPath: /app/config
  values:
    Service:
      # Matches the repository and the Go module,
      # github.com/BinMunawir/client. (Renamed from maal_business on
      # 2026-08-22 — if go.mod still reads the old path the rename has not
      # landed yet. Nothing in this layer uses the module path as an
      # identifier, so neither state breaks anything here.)
      Name: client
      Title: Client (Customer) Domain
      Root: "."
    Temporal:
      # In-cluster Temporal frontend. The chart's default namespace is
      # `default`; give this platform its own before it is anything but dev.
      HostPort: temporal-frontend.temporal.svc.cluster.local:7233
      Namespace: default
    Keycloak:
      BaseURL: http://keycloak-keycloakx-http.keycloak.svc.cluster.local
      Realm: maal
    # No Srv block: config.CNF.Srv has zero usages in this repo. The struct
    # declares Host/Port, but nothing binds them — blueprint.md §2 describes a
    # cmd/server that was never built here. Setting a port would imply a
    # listener that does not exist.

# ─── secrets ───────────────────────────────────────────────────────────────
# Env vars only, per the Go Service Standard §4. The value never appears in
# Git — only the name and where to find it.
secrets:
  enabled: true
  data:
    KEYCLOAK__ADMIN_TOKEN: keycloak/admin-token

# ─── database (external) ───────────────────────────────────────────────────
# The cluster runs no Postgres. This names one you manage yourself:
# `host.docker.internal` is how a kind node reaches a container on your laptop;
# a cloud env puts an RDS/Cloud SQL endpoint here and changes nothing else.
#
# The role and database are created by `just db-init` from
# ../../db/dev-local/bootstrap.sql. Their names keep the `maal` prefix on
# purpose: they live in the external Postgres, outside the cluster, and
# renaming them would create new empty databases beside the old ones rather
# than rename anything.
#
# The credentials are remote keys, not values — they resolve through this
# service's own ExternalSecret, so no database password is in this file or
# anywhere else in the repo. This repo's pg adapter honours DB_DSN and falls
# back to the individual parts, so all three are wired.
database:
  enabled: true
  host: host.docker.internal
  port: 5432
  name: maalbizdb            # external Postgres — see the note above
  sslmode: disable           # a laptop container; `require` in every real env
  credentials:
    userKey: client/db/username
    passwordKey: client/db/password
    dsnKey: client/db/dsn

# ─── migrations ────────────────────────────────────────────────────────────
# goose migrations live in the repo at internal/adapters/pg/migrations, but no
# published image carries them yet. Turning this on before that exists produces
# a Job that fails on every sync. See ../../charts/go-service/templates/
# migration-job.yaml.
migrations:
  enabled: false

# ─── mesh ──────────────────────────────────────────────────────────────────
mesh:
  authorizationPolicy:
    enabled: true
    # Deny all inbound. Correct for this workload: it polls Temporal and calls
    # Keycloak and Postgres outbound, and nothing calls it.
    allowedPrincipals: []
