# The cert-manager half of the Istio mesh CA.
#
# LIVE. This directory is a component in ../appset-vendored.yaml (wave 1), so
# Argo applies it. istio-csr (wave 2) signs every workload certificate from the
# intermediate issued below, and istiod's own CA server is off — see
# ../../envs/dev-local/istiod.yaml.
#
# `just verify l1` section 7 asserts all of this from the live cluster: both
# Certificates Ready, istio-csr serving, ENABLE_CA_SERVER=false, and the trust
# root every workload is handed actually carrying the maal-mesh-root subject.
# That last check is the one that matters — istiod self-signing is invisible
# from Application status, because every component reads Healthy either way.
#
# What this builds:
#
#   selfsigned Issuer ──▶ maal-mesh-root (Certificate, isCA)
#                              │  secret: maal-mesh-root
#                              ▼
#                         maal-mesh-ca (Issuer, ca:)
#                              │
#                              ▼
#                    maal-mesh-intermediate (Certificate, isCA)
#                              │  secret: maal-mesh-intermediate
#                              ▼
#                    maal-mesh-intermediate (Issuer, ca:)
#                              │
#                              ▼
#                         istio-csr signs workload CSRs
#
# istio-csr signs workload certs with the intermediate; the root stays offline in
# anything but dev. In cloud, replace the selfsigned Issuer with a Vault or AWS
# PCA issuer and delete the root Certificate — the chain below is unchanged.
#
# WHY ISSUERS LIVE HERE AT ALL. L1's rule is "install capabilities, not
# instances", and ../../envs/dev-local/cert-manager.yaml says plainly that
# issuers are policy and an L2 concern. The mesh CA is the one exception, and
# it is not a carve-out: the mesh is L1's own workload, so its root of trust is
# L1's to own. These issuers sign nothing but mesh identities.
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: maal-mesh-selfsigned
  namespace: istio-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: maal-mesh-root
  namespace: istio-system
spec:
  isCA: true
  commonName: maal-mesh-root
  secretName: maal-mesh-root
  # 10 years. A mesh root is not something you want rotating on its own
  # schedule; rotation is a planned event with a rollout behind it.
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: maal-mesh-selfsigned
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: maal-mesh-ca
  namespace: istio-system
spec:
  ca:
    secretName: maal-mesh-root
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: maal-mesh-intermediate
  namespace: istio-system
spec:
  isCA: true
  commonName: maal-mesh-intermediate
  secretName: maal-mesh-intermediate
  duration: 8760h      # 1 year
  renewBefore: 720h    # 30 days
  privateKey:
    algorithm: ECDSA
    size: 256
  # No SPIFFE URI here. Under the plugged-in-`cacerts` design this certificate
  # WAS istiod's own identity and carried one. Under istio-csr it is a pure
  # signing CA — the SPIFFE identities are on the leaf certs istio-csr mints —
  # so a URI SAN here would claim something untrue about what this key is.
  issuerRef:
    name: maal-mesh-ca
    kind: Issuer
    group: cert-manager.io
---
# What istio-csr actually signs from. Splitting the issuer from the certificate
# is what lets the root be swapped for Vault/AWS PCA in cloud without istio-csr
# changing at all: it only ever names this issuer.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: maal-mesh-intermediate
  namespace: istio-system
spec:
  ca:
    secretName: maal-mesh-intermediate
