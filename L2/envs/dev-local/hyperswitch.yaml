# Hyperswitch — dev-local.  ⚠ NOT IN THE CATALOG — this file is inert
#
# Nothing reads this file today. Hyperswitch has been removed from
# ../../apps/deps-appset.yaml, so no Application is generated and these values
# are never rendered.
#
# It used to be wired in as a placeholder, with a permanently red
# `dev-local-hyperswitch` documented as expected. That was the wrong call by
# this repo's own rules: a red Application that is normal trains everyone to
# stop reading the dashboard, which is the one thing the conventions in
# ../../../README.md are trying hardest to prevent. Parked properly instead —
# the same treatment maal-ledger gets, for the same reason.
#
# Why it is harder than the others:
#
#  - `hyperswitch-app` is a stack, not a service — the router, the card vault,
#    the key manager, the control centre and the web client, each with its own
#    configuration and its own secrets.
#  - It is a PCI-adjacent component. The card vault and key manager hold the
#    material that makes this a regulated system rather than an ordinary web
#    app, and their configuration deserves a deliberate session, not a
#    plausible-looking default committed by inference.
#  - Its Postgres and Redis are configured inside the chart as bundled
#    subcharts. Every other datastore this platform touches is external and
#    managed outside Kubernetes; adopting Hyperswitch means either rewiring it
#    to an external Postgres — real work, not a host swap — or accepting one
#    stateful exception and the backup story that comes with it.
#  - Its bundled subcharts pull from charts.bitnami.com, whose distribution
#    terms changed materially in 2025. Verify what those subcharts resolve to
#    before trusting a `helm dep update`.
#
# TO UN-PARK: add the element back to ../../apps/deps-appset.yaml, uncomment the
# two chart repos in ../../root/project.yaml, and decide the database question
# above. The master key and admin API key are already named in the dev-local
# ClusterSecretStore, so the secret path is ready when the values are.

redis:
  enabled: true

postgresql:
  enabled: true

# Off: L2 has no edge Gateway yet, and no observability stack to feed.
hyperswitch-control-center:
  enabled: false
hyperswitch-web:
  enabled: false

autoscaling:
  enabled: false
