# Keycloak's external database credentials.
#
# The keycloakx chart has no database-secret plumbing of its own — it takes an
# `extraEnv` block — so ../../dev-local.yaml references these keys
# through secretKeyRef and this object is what materialises them.
#
# Key names are the KC_* env var names the container expects, so the values file
# reads as a straight mapping with nothing to translate.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db
  namespace: keycloak
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: maal-secret-store
    kind: ClusterSecretStore

  target:
    name: keycloak-db
    creationPolicy: Owner

  data:
    - secretKey: KC_DB_USERNAME
      remoteRef:
        key: keycloak/db/username
    - secretKey: KC_DB_PASSWORD
      remoteRef:
        key: keycloak/db/password
