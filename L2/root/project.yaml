apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: maal
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "L2 — the product layer: Go services, their databases, and the third-party apps they run against"

  sourceRepos:
    - git@github.com:BinMunawir/infra.git
    - https://go.temporal.io/helm-charts
    - https://codecentric.github.io/helm-charts
    #
    # A new dependency needs its chart repo listed here as well as a directory
    # under ../deps/ — Argo rejects the sync otherwise. Services need nothing
    # added: they all render from the local chart in this same repo.

  # Namespace per service. THIS IS THE ONE SHARED FILE A NEW SERVICE STILL
  # TOUCHES. Everything else about a service lives in its own directory under
  # ../services/<name>/, but a namespace is a grant, and a grant is not
  # something a generator should be able to hand itself. Argo fails the sync
  # with a clear message if you add a service directory and forget the entry
  # here, which is the intended tripwire.
  destinations:
    # Where maal-root itself lives, and where it writes the four
    # ApplicationSets. WITHOUT THIS ENTRY maal-root cannot sync at all — Argo
    # rejects it with "destination {https://kubernetes.default.svc argocd} is
    # not permitted in project 'maal'" and no L2 Application is ever generated.
    - server: https://kubernetes.default.svc
      namespace: argocd
    # deps — one per directory under ../deps/
    - server: https://kubernetes.default.svc
      namespace: temporal
    - server: https://kubernetes.default.svc
      namespace: keycloak

    # services — one per directory under ../services/
    - server: https://kubernetes.default.svc
      namespace: client
    - server: https://kubernetes.default.svc
      namespace: paymenthub

    # NO `edge`. The Gateway, its TLS listener and its certificate are
    # platform-scoped and live in L1 (L1/edge/). L2 owns only the HTTPRoutes,
    # and each of those sits in the namespace of the service it fronts — which
    # is already listed here.

  # THE BOUNDARY. L2 may not create cluster-scoped resources — no CRDs, no
  # ClusterRoles, no webhooks. That is why the Gateway API CRDs went into L1:
  # keeping this list short is what stops an L2 mistake from reaching the mesh
  # or the operators.
  #
  # ONE exception, and it is purely mechanical:
  #
  #   Namespace   every appset here sets CreateNamespace=true, and Argo creates
  #               that namespace AS the project. Without this entry every sync
  #               fails with "resource :Namespace is not permitted in project
  #               maal" — and it fails on the namespace, so nothing inside it is
  #               ever attempted. The `destinations` list above is what actually
  #               bounds which namespaces L2 may touch; this only grants the
  #               kind. The empty `group` is core/v1, not a wildcard.
  #
  # There used to be a second: ClusterSecretStore. It is gone because the store
  # itself moved to L1, where the operator that owns it already lived. A
  # boundary that needs widening to admit a platform object was telling us the
  # object was on the wrong side of it.
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
