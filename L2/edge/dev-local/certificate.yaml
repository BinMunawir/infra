# TLS for the edge — dev-local.
#
# cert-manager's first real consumer in this repo. L1 installs the capability
# and deliberately creates no issuer, because an issuer is policy: which CA,
# which domains, which challenge. That decision is per-environment, so it lives
# here.
#
# LOCAL: a self-signed root, held in-cluster. `Issuer`, not `ClusterIssuer` —
# L2's AppProject forbids cluster-scoped resources, and that boundary is worth
# more than the convenience.
#
# CLOUD: replace this file with an ACME issuer (DNS-01 against the zone that
# owns `edge_hostname` from the L0 contract). The Gateway above does not change;
# it references `maal-edge-tls` by name either way.
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: maal-edge-selfsigned
  namespace: maal-edge
spec:
  selfSigned: {}
---
# A local root, so the certificate below chains to something stable you can
# trust once in a browser instead of clicking through a warning per service.
#   just edge-ca > maal-local-ca.crt   # then trust it, if you care to
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: maal-edge-ca
  namespace: maal-edge
spec:
  isCA: true
  commonName: maal-local-ca
  secretName: maal-edge-ca
  duration: 87600h     # 10y — a dev root nobody wants to re-trust quarterly
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: maal-edge-selfsigned
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: maal-edge-ca
  namespace: maal-edge
spec:
  ca:
    secretName: maal-edge-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: maal-edge-tls
  namespace: maal-edge
spec:
  # The Gateway's certificateRefs names this Secret.
  secretName: maal-edge-tls
  duration: 2160h      # 90d, ACME-shaped so local and cloud behave alike
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  # Every hostname the routes serve. Adding a route means adding its host here;
  # `just hosts` prints the /etc/hosts lines that make them resolve.
  dnsNames:
    - keycloak.maal.local
    - temporal.maal.local
  issuerRef:
    name: maal-edge-ca
    kind: Issuer
    group: cert-manager.io
