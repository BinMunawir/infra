{{/*
Pulls this service's secrets from the env's SecretStore into a Secret, which
the workloads read as env vars. The CRD comes from L1's external-secrets
operator.

Nothing secret is in this repo — only the *names* of secrets and where to find
them. That is the property worth protecting: the values file is safe to read in
a PR, and rotating a credential in the backing store needs no commit at all.
*/}}
{{- if .Values.secrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "go-service.name" . }}
  labels:
    {{- include "go-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}

  secretStoreRef:
    name: {{ .Values.secrets.storeRef.name }}
    kind: {{ .Values.secrets.storeRef.kind }}

  target:
    name: {{ include "go-service.secretName" . }}
    creationPolicy: Owner

  data:
    {{- range $envName, $remoteKey := .Values.secrets.data }}
    - secretKey: {{ $envName }}
      remoteRef:
        key: {{ $remoteKey | quote }}
    {{- end }}
    {{- /*
    Database credentials, from the same store as everything else. They are
    generated from the shared dbCredentialEnv helper rather than written twice,
    so the env vars on the workload and the keys in this Secret cannot drift.
    */}}
    {{- range $envName, $remoteKey := include "go-service.dbCredentialEnv" . | fromYaml }}
    - secretKey: {{ $envName }}
      remoteRef:
        key: {{ $remoteKey | quote }}
    {{- end }}
{{- end }}
