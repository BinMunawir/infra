# L2/apps/services-appset.yaml — the Go services.
#
# THIS FILE IS NOT THE CATALOG ANY MORE. The catalog is the filesystem:
# one directory per service under ../services/, each holding a service.yaml.
# Adding a service means creating that directory — it never edits this file,
# so two services can be added without touching anything the other reads.
#
#   ls L2/services/          the authoritative list of what exists
#   L2/services/<name>/service.yaml     identity: namespace, wave, repo, image
#   L2/services/<name>/<stage>-<provider>.yaml   chart values for that env
#
# Every service is the same local chart (../charts/go-service) with a different
# values file; adding one never touches a template.
#
# Namespace per service, labelled for the ambient mesh by Argo rather than by
# the chart — the namespace is not the chart's to own.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: maal-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - matrix:
        generators:
          # ── dimension 1: the env cells ─────────────────────────────────
          - git:
              repoURL: git@github.com:BinMunawir/infra.git
              revision: main
              files:
                - path: L2/envs/*.yaml

          # ── dimension 2: the service catalog, read from the filesystem ──
          # One Application per L2/services/*/service.yaml. Argo's file glob is
          # RECURSIVE (`*` crosses `/`), which is harmless here because the
          # pattern pins the filename: a service's values files are named
          # <stage>-<provider>.yaml and are never matched.
          #
          # PARKING, and which mechanism to use:
          #
          #   `replicas: 0` in the values file — the manifests are right but
          #   the repo or its image is not ready. The Application syncs green
          #   and runs no pods, so Argo shows the wiring rather than
          #   advertising a crash loop as the normal state.
          #
          #   Delete the directory — the service cannot work at all, and no
          #   amount of configuration fixes it.
          #
          # Currently parked:
          #   paymenthub  0 replicas — its Temporal client hardcodes
          #                            client.DefaultHostPort, so a pod would
          #                            dial itself and log.Fatalf at startup
          - git:
              repoURL: git@github.com:BinMunawir/infra.git
              revision: main
              files:
                - path: L2/services/*/service.yaml

  template:
    metadata:
      name: '{{.stage}}-{{.provider}}-{{.service}}'
      labels:
        service/stage: '{{.stage}}'
        service/provider: '{{.provider}}'
        service/name: '{{.service}}'
        service/wave: '{{.wave}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
        # The source repo, carried onto the Application so `kubectl get app -o
        # jsonpath` can answer "where does this image come from" without
        # reading the infra tree. Argo never clones it.
        service/repo: '{{.repo}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: maal

      sources:
        - repoURL: git@github.com:BinMunawir/infra.git
          targetRevision: main
          path: L2/charts/go-service
          helm:
            releaseName: '{{.service}}'
            ignoreMissingValueFiles: true
            valueFiles:
              # Chart defaults, then the service's values for this env, which
              # sit in the service's own directory. A service with no file for
              # this env gets chart defaults, which will not be a working
              # deployment — `just check envs` lists the gaps.
              - $values/L2/services/{{.service}}/{{.stage}}-{{.provider}}.yaml

        - repoURL: git@github.com:BinMunawir/infra.git
          targetRevision: main
          ref: values

      destination:
        server: '{{.destination.server}}'
        namespace: '{{.namespace}}'

      syncPolicy:
        automated:
          # PRUNE IS ON HERE, and only here. Everything a service owns is
          # derived from its values file — Deployment, ConfigMap,
          # ServiceAccount, ExternalSecret, AuthorizationPolicy — and all of it
          # is reconstructible from Git. Without prune, renaming a workload key
          # leaves the old Deployment running forever with no signal, which is
          # the drift this layer is least able to notice.
          #
          # The layers that hold or gate state keep prune:false: the platform
          # (L1), the secret stores, and the edge. L1 additionally cannot prune
          # because five of its components ship CRDs, and deleting a CRD
          # garbage-collects every custom resource of that kind CLUSTER-WIDE —
          # including this layer's AuthorizationPolicies and ExternalSecrets.
          # The blast radius of an L1 prune is not L1.
          #
          # And no database is at risk either way — every Postgres this platform
          # uses is external and outside the cluster's reach entirely.
          #
          # To exempt one resource, annotate it:
          #   argocd.argoproj.io/sync-options: Prune=false
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        # Enrol the namespace in the ambient mesh at creation. Doing it here
        # rather than in the chart keeps namespace ownership with the thing
        # that creates the namespace.
        managedNamespaceMetadata:
          labels:
            istio.io/dataplane-mode: ambient
            service/name: '{{.service}}'

            # POD SECURITY ADMISSION — `restricted`, enforced.
            #
            # charts/go-service already renders every workload to this profile:
            # runAsNonRoot with an explicit uid, allowPrivilegeEscalation
            # false, readOnlyRootFilesystem, all capabilities dropped, and the
            # RuntimeDefault seccomp profile. Until now that was a CONVENTION —
            # a values file could override podSecurityContext and nothing would
            # object. These three labels make it an invariant the API server
            # enforces at admission, so the override is rejected instead of
            # deployed.
            #
            # Safe to enforce here precisely because the chart already complies:
            # this codifies what the workloads do today rather than asking them
            # to change. The third-party deps are a different story — see the
            # `baseline` note in ./deps-appset.yaml.
            #
            # audit + warn alongside enforce so a rejected pod says WHY in the
            # Application's sync message rather than just failing to appear.
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/audit: restricted
            pod-security.kubernetes.io/warn: restricted
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
