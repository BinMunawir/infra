# Temporal's external database password.
#
# The Temporal chart takes `existingSecret` per datastore and reads the key
# `password` from it — username, host and database name are plaintext values in
# ../../dev-local.yaml. So this Secret carries exactly one key,
# named to match what the chart looks for.
#
# Both datastores (default + visibility) share one credential because they are
# two databases on one server with one owner. Split them here if that stops
# being true.
#
# ORDERING: the temporal namespace is created by the deps ApplicationSet at wave 0 and
# this syncs at wave -1, so on a cold bring-up it fails once with "namespace not
# found", backs off, and succeeds. Same retry-as-ordering used throughout.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-db
  namespace: temporal
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: maal-secret-store
    kind: ClusterSecretStore

  target:
    name: temporal-db
    creationPolicy: Owner

  data:
    - secretKey: password
      remoteRef:
        key: temporal/db/password
