# L2/apps/secrets-appset.yaml — the ClusterSecretStore each environment pulls
# its secrets from.
#
# One Application per env, sourcing L2/secrets/<stage>-<provider>/. That
# directory is where the local `fake` provider and a cloud Secrets Manager
# differ — and the only place they differ. Every ExternalSecret the go-service
# chart renders refers to the store by name, so nothing else changes when an
# env moves to a real backend.
#
# Syncs at wave -1: an ExternalSecret with no store just sits Pending, and the
# workload waiting on its Secret never starts.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: maal-secrets
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - git:
        repoURL: git@github.com:BinMunawir/infra.git
        revision: main
        files:
          - path: L2/envs/*.yaml

  template:
    metadata:
      name: '{{.stage}}-{{.provider}}-secret-store'
      labels:
        maal/stage: '{{.stage}}'
        maal/provider: '{{.provider}}'
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: maal
      source:
        repoURL: git@github.com:BinMunawir/infra.git
        targetRevision: main
        path: L2/secrets/{{.stage}}-{{.provider}}
        directory:
          recurse: false
      destination:
        server: '{{.destination.server}}'
        # A ClusterSecretStore is cluster-scoped; the namespace here is only
        # where Argo tracks the resource.
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
