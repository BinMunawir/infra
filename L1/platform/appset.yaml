# L1/platform/appset.yaml — the whole platform, for every environment.
#
# A matrix generator crosses two things:
#   1. git files  — every L1/envs/*.yaml, i.e. every {stage}-{provider} cell
#   2. list       — the component catalog below
#
# The product is one Argo Application per (env, component). Adding an env is a
# new file in envs/; adding a component is a new list element here. Neither
# requires touching the other.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  # Don't delete a live Application because a generator hiccuped (a transient
  # git failure would otherwise look like "this env no longer exists").
  preservedFields:
    annotations: ["argocd.argoproj.io/sync-wave"]

  generators:
    - matrix:
        generators:
          # ── dimension 1: environments ──────────────────────────────────
          - git:
              repoURL: git@github.com:BinMunawir/infra.git
              revision: main
              files:
                - path: L1/envs/*.yaml
                # Argo's file glob is RECURSIVE — `*` crosses `/` — so the line
                # above also matches the per-component values in envs/<env>/.
                # Those carry no `stage`/`provider`, and under missingkey=error
                # one such match fails the whole generator, yielding zero
                # Applications. Exclude them explicitly.
                - path: L1/envs/*/*.yaml
                  exclude: true

          # ── dimension 2: the component catalog ─────────────────────────
          # `wave` orders components within an env — see the ordering note in
          # ../Readme.md for what that does and does not guarantee.
          - list:
              elements:
                - component: cert-manager
                  chart: cert-manager
                  repoURL: https://charts.jetstack.io
                  version: v1.21.1
                  namespace: cert-manager
                  wave: "0"

                - component: istio-base
                  chart: base
                  repoURL: https://istio-release.storage.googleapis.com/charts
                  version: 1.30.3
                  namespace: istio-system
                  wave: "0"

                - component: istio-cni
                  chart: cni
                  repoURL: https://istio-release.storage.googleapis.com/charts
                  version: 1.30.3
                  namespace: istio-system
                  wave: "1"

                # THE MESH CA. Replaces istiod's own CA server: istiod starts
                # with ENABLE_CA_SERVER=false and every workload — including
                # ztunnel — requests its certificate from here, which signs it
                # through cert-manager from the chain in ../platform/mesh-ca.
                #
                # Upstream is explicit that installing istio-csr after Istio is
                # not a supported path, because the mesh's root of trust changes
                # underneath running workloads. It is safe on this cluster (the
                # mesh carries no traffic yet) and it converged cleanly, but on
                # a cluster with live workloads treat it as a planned migration
                # with a pod rollout behind it, not a values bump.
                #
                # Bump: compare with `helm search repo jetstack/cert-manager-istio-csr --versions`.
                - component: istio-csr
                  chart: cert-manager-istio-csr
                  repoURL: https://charts.jetstack.io
                  version: v0.17.0
                  namespace: istio-system
                  wave: "2"

                # Wave 3, not 1: istiod must not start until istio-csr is
                # serving, or it comes up self-signed and stays that way until
                # something restarts it.
                - component: istiod
                  chart: istiod
                  repoURL: https://istio-release.storage.googleapis.com/charts
                  version: 1.30.3
                  namespace: istio-system
                  wave: "3"

                # NO DATABASE OPERATOR, DELIBERATELY. Every Postgres this
                # platform talks to is external and managed outside the cluster
                # (RDS, Cloud SQL, a laptop container in dev). The cluster
                # therefore runs no stateful database workload, holds no
                # database PVC, and cannot lose data it never stored. L2 carries
                # only host/port/name in Git and pulls credentials through
                # External Secrets — see L2/Readme.md.
                #
                # Reintroducing an in-cluster operator (CloudNativePG or
                # otherwise) is a deliberate architecture change, not a catalog
                # addition: it moves durability into the cluster and pulls
                # backup, restore and failover in with it.

                # Provides the ExternalSecret/SecretStore CRDs that L2 uses for
                # every credential — including every database credential, now
                # that nothing in-cluster mints one.
                - component: external-secrets
                  chart: external-secrets
                  repoURL: https://charts.external-secrets.io
                  version: 2.9.0
                  namespace: external-secrets
                  wave: "1"

                - component: ztunnel
                  chart: ztunnel
                  repoURL: https://istio-release.storage.googleapis.com/charts
                  version: 1.30.3
                  namespace: istio-system
                  wave: "4"

  # Progressive sync — LIVE. The applicationset controller reads
  # `applicationsetcontroller.enable.progressive.syncs` from argocd-cmd-params-cm,
  # which ../bootstrap/argocd/kustomization.yaml sets. Because that is part of
  # the manifests Argo self-manages, it survives self-heal; the imperative
  # `kubectl patch` this replaced did not.
  #
  # Verify with `just progressive`. If it ever reads OFF, this block is ignored
  # and ordering falls back to retry/back-off — which converges, noisily.
  # Five steps now, because the mesh CA sits in the middle of the mesh's own
  # dependency chain: cert-manager (0) → mesh-ca (1, in the vendored appset) →
  # istio-csr (2) → istiod (3) → ztunnel (4). Each step waits for the previous
  # to go Healthy, which is what stops istiod booting self-signed.
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: platform.maal/wave
              operator: In
              values: ["0"]
        - matchExpressions:
            - key: platform.maal/wave
              operator: In
              values: ["1"]
        - matchExpressions:
            - key: platform.maal/wave
              operator: In
              values: ["2"]
        - matchExpressions:
            - key: platform.maal/wave
              operator: In
              values: ["3"]
        - matchExpressions:
            - key: platform.maal/wave
              operator: In
              values: ["4"]

  template:
    metadata:
      name: '{{.stage}}-{{.provider}}-{{.component}}'
      labels:
        platform.maal/stage: '{{.stage}}'
        platform.maal/provider: '{{.provider}}'
        platform.maal/component: '{{.component}}'
        platform.maal/wave: '{{.wave}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform

      sources:
        # The upstream chart. `dig` lets an env override the catalog version:
        # envs/<env>.yaml `versions.<component>` wins, else `.version` here.
        - repoURL: '{{.repoURL}}'
          chart: '{{.chart}}'
          targetRevision: '{{ dig "versions" .component .version . }}'
          helm:
            releaseName: '{{.component}}'
            # Our values, read out of the second source below. Missing file is
            # fine — it just means this component takes chart defaults here.
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/L1/envs/{{.stage}}-{{.provider}}/{{.component}}.yaml

        # This repo, mounted only so the chart above can read valueFiles from
        # it. `ref` with no `path` contributes no manifests of its own.
        - repoURL: git@github.com:BinMunawir/infra.git
          targetRevision: main
          ref: values

      destination:
        server: '{{.destination.server}}'
        namespace: '{{.namespace}}'

      syncPolicy:
        automated:
          prune: false      # additive convergence; never auto-delete platform resources
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true   # Istio/cert-manager/ESO CRDs blow past the
                                   # 262144-byte client-side apply annotation
          # Without this, the ignoreDifferences below only silences the diff:
          # the server-side apply above still sends the chart's values on every
          # sync, and the fight continues unreported — which is worse, because
          # the Application then reads Synced while the object churns.
          - RespectIgnoreDifferences=true
        retry:
          # Still 10, and still worth it: progressive syncs order Applications,
          # but a chart whose webhook is not yet serving still needs a second
          # attempt. This is now the safety net rather than the mechanism.
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m

      # THE ONE FIELD THE CLUSTER OWNS, NOT GIT.
      #
      # Istio's charts render these webhooks with `failurePolicy: Ignore` and an
      # empty caBundle, and the chart says in a comment next to the field that
      # istiod patches both once its certificate is ready. With selfHeal on and
      # no exception, Argo reverts that patch, istiod re-applies it, and the
      # object churns forever — observed here at ~4 writes/10s, generation past
      # 260 in fifteen minutes.
      #
      # The cost is not just noise. The Application never reads Synced, so
      # RollingSync never leaves wave 0, and ztunnel in wave 2 waits behind it
      # indefinitely. A mesh with no dataplane, from a webhook field.
      #
      # Scoped to the two fields istiod actually owns: everything else about
      # these webhooks — the rules, the selectors — still reconciles from Git.
      # cert-manager's cainjector does the same thing to its own webhook, so
      # this covers that too rather than waiting for it to bite.
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - '.webhooks[]?.failurePolicy'
            - '.webhooks[]?.clientConfig.caBundle'
