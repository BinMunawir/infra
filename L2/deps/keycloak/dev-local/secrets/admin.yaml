# Keycloak's initial admin credentials.
#
# The keycloakx chart is upstream and renders no ExternalSecret of its own, so
# this object lives here alongside the store rather than in a values file. It
# carries an explicit namespace: the Application syncing this directory targets
# `external-secrets`, and Argo applies a resource to whatever namespace it
# declares as long as the AppProject allows that destination.
#
# ORDERING: the keycloak namespace is created by the deps ApplicationSet at
# wave 0, and this syncs at wave -1 — so on a cold bring-up this fails once with "namespace
# not found", backs off, and succeeds. Same retry-as-ordering mechanism used
# throughout L1 and L2.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin
  namespace: keycloak
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: maal-secret-store
    kind: ClusterSecretStore

  target:
    name: keycloak-admin
    creationPolicy: Owner

  data:
    # Keycloak 26 renamed the bootstrap admin variables. KC_BOOTSTRAP_ADMIN_* is
    # what a current image reads; KEYCLOAK_ADMIN_* is the pre-26 spelling, kept
    # so this Secret works either side of an image bump. Both are sourced from
    # the same store keys, so they cannot disagree.
    - secretKey: KC_BOOTSTRAP_ADMIN_USERNAME
      remoteRef:
        key: keycloak/admin-user
    - secretKey: KC_BOOTSTRAP_ADMIN_PASSWORD
      remoteRef:
        key: keycloak/admin-password
    - secretKey: KEYCLOAK_ADMIN
      remoteRef:
        key: keycloak/admin-user
    - secretKey: KEYCLOAK_ADMIN_PASSWORD
      remoteRef:
        key: keycloak/admin-password
