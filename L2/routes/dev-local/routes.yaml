# What is reachable from outside — dev-local.
#
# The application half of the edge. L1 owns the Gateway, its listener and its
# certificate (L1/edge/dev-local/); this file is the routing table, and it lives
# in L2 because every entry in it names a Maal service.
#
# That is the Gateway API's own persona split — cluster operator owns Gateways,
# application teams own Routes — and it is why adding a service no longer means
# editing anything in L1.
#
# Each HTTPRoute lives in the namespace of the service it fronts, so its
# backendRef is same-namespace and no ReferenceGrant is needed. (ReferenceGrant
# governs backendRefs and certificateRefs across namespaces, not parentRefs;
# attaching to a Gateway in another namespace is controlled by that Gateway's
# `allowedRoutes`, which is set to `from: All`.)
#
# Nothing here fronts a Maal Go service. maal-business is a Temporal worker with
# no inbound port at all, and maal-ledger — the only one that serves HTTP — is
# parked. When a service does need to be reachable, add a route beside it here.
# THAT IS THE WHOLE STEP: the certificate in L1 is a single wildcard over the
# env's domain and does not track this list.
#
# ─── the naming rule ───────────────────────────────────────────────────────
# Hostnames must be ONE label under the env's domain:
#
#     <name>.127.0.0.1.nip.io          ✓  covered by the wildcard
#     <a>.<b>.127.0.0.1.nip.io         ✗  a TLS wildcard matches one label only
#
# Nesting needs a new SAN and a new listener in L1 for every level — see the
# long note in L1/edge/dev-local/certificate.yaml. Use flat labels instead:
# `web-temporal.127.0.0.1.nip.io`, not `web.temporal.127.0.0.1.nip.io`.
#
# ─── why nip.io ────────────────────────────────────────────────────────────
# `*.127.0.0.1.nip.io` is real public DNS: nip.io answers any `<label>.<ip>`
# name with that IP, so these hostnames resolve to 127.0.0.1 on any machine
# with no /etc/hosts entry, no sudo, and no local resolver config. That matters
# because the previous `*.maal.local` names resolved ONLY on a laptop whose
# owner had edited /etc/hosts — which made the edge, the one path this layer
# exists to provide, unusable for everyone else and unverifiable in CI.
#
# `.local` was also the wrong suffix on macOS specifically: it is reserved for
# mDNS/Bonjour, so mDNSResponder can answer ahead of /etc/hosts.
#
# LOCAL ONLY. These names hardcode a loopback address and are meaningless off
# this laptop. A cloud env replaces this directory with routes carrying real
# hostnames in a zone it owns.
#
#   just urls         # prints the reachable URLs  (from L1)
#
# ─── why every default is written out ──────────────────────────────────────
# `parentRefs` and `rules` are ATOMIC lists in the HTTPRoute schema, and this
# Application syncs with ServerSideApply=true. Argo therefore owns each list
# whole, and the fields the CRD defaults — parentRefs[].group/.kind,
# backendRefs[].group/.kind/.weight, and the implicit `matches` PathPrefix "/"
# — land inside a subtree Argo believes it manages. A manifest that leaves them
# out applies successfully and then reads OutOfSync forever, because Argo
# compares what it owns in the cluster against a Git copy that is missing half
# of it. `kubectl diff` shows nothing, which is what makes it confusing.
#
# So: state the defaults. That is the honest declarative position anyway — the
# routing table is fully described here rather than half here and half in the
# API server's defaulting rules.
---
# Keycloak's admin console and OIDC endpoints.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: maal-keycloak
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: maal-edge
      namespace: maal-edge
      sectionName: https
  hostnames:
    - keycloak.127.0.0.1.nip.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: keycloak-keycloakx-http
          port: 80
          weight: 1
---
# Temporal Web — workflow histories, which is the only way to debug a worker.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: temporal-web
  namespace: maal-temporal
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: maal-edge
      namespace: maal-edge
      sectionName: https
  hostnames:
    - temporal.127.0.0.1.nip.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: temporal-web
          port: 8080
          weight: 1
