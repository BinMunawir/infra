# L2/apps/deps-appset.yaml — the third-party applications the Go services run
# against: Temporal and Keycloak.
#
# These are instances, not capabilities — L1 installs the operators, L2 declares
# what runs. The split is the whole reason L1 stays reusable under a different
# product.
#
# THE CATALOG IS THE FILESYSTEM, exactly as it is for services: one directory
# per dependency under ../deps/, each holding a dep.yaml. Adding one never
# edits this file.
#
#   ls L2/deps/                        what third-party software runs here
#   L2/deps/<name>/dep.yaml            identity: chart, repo, version, ns, wave
#   L2/deps/<name>/<stage>-<provider>.yaml   chart values for that env
#
# Their databases are EXTERNAL. Each chart is pointed at a host in its values
# file, and its credentials come from an ExternalSecret in ../secrets/<env>/.
# Nothing here creates a database, and the cluster stores no database state.
#
# HYPERSWITCH was removed entirely — chart, values and AppProject sourceRepos.
# It is PCI-adjacent, ships a stack of four components, and configures its
# Postgres inside the chart rather than pointing at an external host, so
# adopting it is a deliberate session rather than a values tweak.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: maal-deps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - matrix:
        generators:
          # ── dimension 1: the env cells ─────────────────────────────────
          - git:
              repoURL: git@github.com:BinMunawir/infra.git
              revision: main
              files:
                - path: L2/envs/*.yaml

          # ── dimension 2: the dependency catalog, read from the filesystem ─
          # The glob pins the filename, so a dep's values files — named
          # <stage>-<provider>.yaml — are never picked up as catalog entries
          # even though Argo's file glob is recursive.
          - git:
              repoURL: git@github.com:BinMunawir/infra.git
              revision: main
              files:
                - path: L2/deps/*/dep.yaml

  template:
    metadata:
      name: '{{.stage}}-{{.provider}}-{{.app}}'
      labels:
        service/stage: '{{.stage}}'
        service/provider: '{{.provider}}'
        service/dep: '{{.app}}'
        service/wave: '{{.wave}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: maal

      sources:
        - repoURL: '{{.repoURL}}'
          chart: '{{.chart}}'
          targetRevision: '{{ dig "versions" .app .version . }}'
          helm:
            releaseName: '{{.app}}'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/L2/deps/{{.app}}/{{.stage}}-{{.provider}}.yaml

        - repoURL: git@github.com:BinMunawir/infra.git
          targetRevision: main
          ref: values

      destination:
        server: '{{.destination.server}}'
        namespace: '{{.namespace}}'

      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        managedNamespaceMetadata:
          labels:
            istio.io/dataplane-mode: ambient
            service/dep: '{{.app}}'

            # POD SECURITY ADMISSION — `baseline`, not `restricted`.
            #
            # The services in ./services-appset.yaml get `restricted`, because
            # charts/go-service is ours and already renders to that profile.
            # These are UPSTREAM charts: Temporal's schema jobs and the
            # keycloakx chart set their own pod security contexts, and neither
            # promises the `restricted` profile across version bumps.
            # Enforcing it here would mean a chart bump could start silently
            # rejecting pods at admission — turning someone else's release note
            # into our outage.
            #
            # `baseline` still blocks the things that actually matter for a
            # namespace on the shared mesh: privileged containers, host
            # namespaces, hostPath volumes, and unsafe sysctls.
            #
            # The audit/warn labels are `restricted` on purpose. They are
            # non-blocking, so they cost nothing and they tell us exactly how
            # far each chart is from the stricter profile — which is the
            # evidence needed before promoting enforce to `restricted` here.
            pod-security.kubernetes.io/enforce: baseline
            pod-security.kubernetes.io/audit: restricted
            pod-security.kubernetes.io/warn: restricted
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
