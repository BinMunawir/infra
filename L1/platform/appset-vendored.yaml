# L1/platform/appset-vendored.yaml — platform components that are vendored
# manifests rather than Helm charts.
#
# Same {stage}×{provider} matrix as appset.yaml; only the source shape differs
# (a path in this repo instead of a chart in an upstream repo). Two generators
# rather than one conditional template, because a template that branches on
# whether `.chart` is set is harder to read than two honest lists.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-vendored
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - matrix:
        generators:
          - git:
              repoURL: git@github.com:BinMunawir/infra.git
              revision: main
              files:
                - path: L1/envs/*.yaml
                # Recursive glob — see the note in appset.yaml.
                - path: L1/envs/*/*.yaml
                  exclude: true

          - list:
              elements:
                # Kubernetes Gateway API CRDs. istiod cannot provision a
                # gateway without these, and they are cluster-scoped — which is
                # why they live in L1 rather than L2. Keeping them here lets
                # L2's AppProject stay free of CRD permissions.
                #
                # Bump: change `version`, re-run `just vendor-gateway-api`.
                # NOTE the key is `manifestPath`, not `path`. The git file
                # generator injects its own `path` object (`.path.basename`,
                # `.path.filename`, …), and a list key of the same name shadows
                # it — silently, and only because the list generator happens to
                # come second in the matrix. Renaming keeps both visible.
                - component: gateway-api
                  manifestPath: L1/vendor/gateway-api
                  version: v1.6.1
                  namespace: gateway-system
                  wave: "0"

                # The mesh's root of trust: a cert-manager CA chain that
                # istio-csr signs workload certificates from. Not a chart —
                # four cert-manager objects — so it belongs in this appset.
                #
                # ORDERING CAVEAT, WORTH KNOWING: this ApplicationSet has no
                # RollingSync strategy, so `wave` here is a sync-wave annotation
                # only and does NOT gate on the other appset's waves. On a
                # cold cluster this may sync before cert-manager's CRDs are
                # served and fail with "no matches for kind Certificate"; the
                # retry/backoff in the template below is what converges it.
                # Noisy on first boot, correct by the time it matters — and the
                # alternative, merging the two appsets, costs more than it buys.
                # No `version`: unlike gateway-api these manifests are ours, not
                # a vendored upstream release, so there is no tag to pin. The
                # template never reads the key.
                - component: mesh-ca
                  manifestPath: L1/platform/mesh-ca
                  namespace: istio-system
                  wave: "1"

  template:
    metadata:
      name: '{{.stage}}-{{.provider}}-{{.component}}'
      labels:
        platform/stage: '{{.stage}}'
        platform/provider: '{{.provider}}'
        platform/component: '{{.component}}'
        platform/wave: '{{.wave}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: git@github.com:BinMunawir/infra.git
        targetRevision: main
        path: '{{.manifestPath}}'
        directory:
          recurse: false
      destination:
        server: '{{.destination.server}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true   # CRD-sized manifests
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
