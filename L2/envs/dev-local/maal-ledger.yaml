# maal-ledger — dev-local.  ⚠ NOT IN THE CATALOG — this file is inert
#
# Source: ../../../ledger  (module github.com/BinMunawir/ledger_api)
#
# Nothing reads this file today. maal-ledger has been removed from the service
# catalog in ../../apps/services-appset.yaml, so no Application is generated and
# these values are never rendered. It is kept because the wiring below is
# correct and re-enabling should be one line, not a rewrite.
#
# WHY IT IS PARKED — TigerBeetle is not deferred here, it is already load-bearing
#
# An earlier version of this file claimed ledger had no datastore because
# "balances are TigerBeetle's job, and TigerBeetle is deferred". That was wrong.
# The repo imports tigerbeetle-go v0.17.8 and uses it in
# internal/adapters/tb/{helpers,read,write,utils}.go. The connection is a
# hardcoded literal — internal/adapters/tb/helpers.go:14:
#
#     func connect() tb.Client {
#         tbAddress := "4000"                       // → 127.0.0.1:4000
#         c, err := tb.NewClient(tb.ToUint128(0), []string{tbAddress})
#         if err != nil { panic(...) }              // panics, does not return
#     }
#
# So no env var can point it at a TigerBeetle Service, and with TigerBeetle
# unreachable every POST /transactions panics into chi's Recoverer and returns
# 500. The service would come up, serve `/` and `/docs`, and fail at its actual
# job. That hardcoded native client is also why the Dockerfile needs
# CGO_ENABLED=1 and a glibc runtime base (ubi-minimal) rather than distroless.
#
# TO UN-PARK, both are required:
#   1. Deploy TigerBeetle — a StatefulSet with fast direct-attached storage.
#   2. Add a config block to the repo for its address, and make connect()
#      return an error instead of panicking.
# Then add the maal-ledger element back to ../../apps/services-appset.yaml.
#
# Of the three repos this is the only one that already HAS a Dockerfile, and it
# is the model the other two should copy: UBI10 build stage, ubi-minimal
# runtime, binary at /app/server, config/*.yml copied to /app/config,
# USER 1001 — which is exactly what the go-service chart assumes.

image:
  registry: ""
  repository: maal/ledger
  tag: dev
  pullPolicy: IfNotPresent

workloads:
  server:
    command: ["/app/server"]
    replicas: 1
    http:
      enabled: true
      port: 9090          # ledger reads PORT (default 9090), not SERVER__PORT
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {memory: 384Mi}

config:
  env: dev
  mountPath: /app/config
  values:
    Service:
      Name: ledger
      Title: Maal Ledger API
      Root: "."
  env_:
    # ledger reads PORT; client and maalstream_ph read SERVER__PORT. Keeping
    # the difference visible rather than normalising it in the chart — the
    # chart should not know each service's config quirks.
    PORT: "9090"
    # A TIGERBEETLE__ADDRESS would go here once the repo reads one.

# No database block: ledger's config has no Db block at all. Its datastore is
# TigerBeetle — see the header — which is external to this cluster like every
# other datastore here, and needs a config field in the repo before an address
# can be handed to it.
secrets:
  enabled: false
database:
  enabled: false
migrations:
  enabled: false

mesh:
  authorizationPolicy:
    enabled: true
    # When maal-business starts calling it, add:
    #   - cluster.local/ns/maal-business/sa/maal-business
    allowedPrincipals: []
